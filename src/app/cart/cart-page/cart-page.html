<div class="cart-conteiner" style="padding: 20px; max-width: 800px; margin: 0 auto;">
  <h2>Seu Carrinho</h2>

  <div *ngIf="cartService.cartItems().length === 0" style="margin-top: 20px;">
    <p>O seu carrinho está vazio nno momento.</p>
  </div>

  <div *ngIf="cartService.cartItems().length > 0">
    <div *ngFor="let item of cartService.cartItems()"
    style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; padding: 15px 0;">
  <div>
    <h3 style="margin: 0 0 5px 0;">{{ item.product.name }}</h3>
    <p style="margin: 0; color: #666;">Quantidade: {{ item.quantity }}</p>
  </div>
  <p style="font-weight: bold;">R$ {{ item.product.price }}</p>
    </div>

    <div style="margin-top: 30px; text-align: right;">
      <h3>Total de itens: {{ cartService.totalItems() }}</h3>
      <button mat-raised-button color="primary" style="margin-top: 10px;">Finalizar Compra</button>
    </div>
  </div>
</div>
