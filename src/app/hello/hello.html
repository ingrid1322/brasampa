<p>Brasampa!</p>

<h1>{{ title }}</h1>

<button [disabled]="isDisabled" (click)="onClick()">🛒</button>


<h1>Count: {{ count() }}</h1>
<h1>Double {{ doubleCount() }}</h1>

<button (click)="increateCounter()">+</button>
<button (click)="decreaseCounter()">-</button>

<button (click)="resetCounter()">Reset</button>
