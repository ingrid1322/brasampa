<mat-card class="product-card">
  <mat-card-header>
    <mat-card-title>{{ product().name }}</mat-card-title>
  </mat-card-header>

 <mat-card-content>
  <p class="description">{{ product().description }}</p>

  <div class="prices">
    @if (product().originalPrice) {
      <span class="priginal-price">R$ {{ product().originalPrice }}</span>
    }
    <span class="current-price">R$ {{ product().price }}</span>
  </div>

 </mat-card-content>

  <mat-card-actions>
    <button mat-flat-button (click)="onAddToCard()">
      Comprar
    </button>
  </mat-card-actions>
</mat-card>
