<mat-card class="product-card">
  <mat-card-header>
    <mat-card-title>{{ product().name }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    @if (product().originalPrice) {
      <span class="sale-badge">Á Venda</span>
    }

   <div class="price-row">
    @if (product().originalPrice) {
      <span class="current-price">{{ product().price }}</span>
      <span class="original-price">{{ product().originalPrice}}</span>
    } @else {
      <span class="current-price">{{ product().description }}</span>
    }
   </div>

   <p class="product-description">{{ product().description }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button matButton (click)="onAddToCard()">{{ addButtonLabel() }}</button>
  </mat-card-actions>
</mat-card>
